# Authentication config for dashboard/app.py's login gate (streamlit-authenticator).
#
# This file is intentionally checked into git, which would be a serious
# mistake for a real app's secrets -- but there is nothing sensitive here.
# Every login below sees the same synthetic, seeded dataset that
# data/generate_data.py produces, never anyone's real financial data. The
# whole point of this project is "clone it, or open the live link, and it
# just works" -- a gitignored secrets file would break both of those for
# anyone but the original author. Both passwords are also shown directly on
# the app's login screen, on purpose. See README.md and ROADMAP.md.
#
# cookie.key signs the "remember me" session cookie. For a real app this
# would be a private, unguessable value; here it's just a fixed string,
# since there's no session worth forging.

[auth.cookie]
name = "cashpulse_auth"
key = "cashpulse-demo-cookie-key-not-a-real-secret-2026"
expiry_days = 30

[auth.credentials.usernames.demo]
name = "Demo (all accounts)"
password = "$2b$12$6nlY2pFpDRzuGdStOOq7XOQVor.GwlCawClVE4U51JTGUN0AcaPIK"
email = "demo@example.com"

[auth.credentials.usernames.nina]
name = "Nina Alvarez"
password = "$2b$12$gcG2Sd3I37v1RiYs6wUayODwmFjS2dyQPkWSynyE5igvTsmAVarGC"
